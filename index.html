<style>
@font-face { font-family:'Lora'; src:url('./_shared/fonts/Lora-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:'Lora'; src:url('./_shared/fonts/Lora-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }
@font-face { font-family:'Lora'; src:url('./_shared/fonts/Lora-Italic.ttf') format('truetype'); font-weight:400; font-style:italic; font-display:swap; }
@font-face { font-family:'WorkSans'; src:url('./_shared/fonts/WorkSans-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:'WorkSans'; src:url('./_shared/fonts/WorkSans-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:swap; }

:root{
  --bg:#F7F3F0;
  --bg2:#FDFBF7;
  --bg3:#FFFFFF;
  --ink:#3A322B;
  --ink-soft:#5C5048;
  --muted:#8C7F73;
  --muted2:#A89B8E;
  --rule:#E9DFD3;
  --rule-soft:#F0E8DD;
  --accent:#98A9BC;       /* 雾霾蓝灰 主色 */
  --accent-ink:#5E7084;
  --accent2:#E8CFC1;      /* 奶油杏 辅助色 */
  --accent3:#7A4A54;      /* 勃艮第柔棕 点缀 */
  --want:#98A9BC;
  --reading:#7A4A54;
  --read:#8B9A77;
  --dropped:#A39B91;
  --shadow:0 10px 30px -12px rgba(122,74,84,.18);
  --shadow-sm:0 3px 12px -4px rgba(122,74,84,.12);
  --shadow-lg:0 24px 60px -20px rgba(58,50,43,.30);
  --radius:16px;
  --radius-md:11px;
  --radius-sm:8px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:
    radial-gradient(1200px 600px at 12% -8%, rgba(152,169,188,.10), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(232,207,193,.14), transparent 55%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'WorkSans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent2);color:var(--ink)}

/* ---------- Header ---------- */
.app-header{
  position:sticky;top:0;z-index:40;
  background:rgba(247,243,240,.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--rule);
}
.header-inner{
  max-width:1280px;margin:0 auto;padding:14px 28px;
  display:flex;align-items:center;gap:24px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(140deg,var(--accent3),#9c5f6c);
  display:grid;place-items:center;color:#fff;
  box-shadow:var(--shadow-sm);flex-shrink:0;
}
.brand-mark svg{width:21px;height:21px}
.brand-text h1{font-family:'Lora',serif;font-size:21px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.brand-text span{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}

.nav-tabs{display:flex;gap:4px;margin-left:auto;background:var(--rule-soft);padding:4px;border-radius:12px;flex-shrink:0}
.nav-tab{
  padding:8px 18px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);
  transition:all .2s;display:flex;align-items:center;gap:7px;
}
.nav-tab svg{width:16px;height:16px}
.nav-tab:hover{color:var(--ink)}
.nav-tab.active{background:var(--bg3);color:var(--accent3);box-shadow:var(--shadow-sm)}

.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  color:var(--muted);border:1px solid var(--rule);background:var(--bg3);transition:all .18s;
}
.icon-btn:hover{color:var(--accent3);border-color:var(--accent3);transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px}

.search-box{
  flex:1;max-width:300px;display:flex;align-items:center;gap:8px;
  padding:0 14px;border:1px solid var(--rule);border-radius:10px;
  background:var(--bg);transition:border-color .15s,box-shadow .15s;min-width:0;
}
.search-box:focus-within{border-color:var(--accent3);box-shadow:0 0 0 3px rgba(122,74,84,.08)}
.search-box svg{width:16px;height:16px;color:var(--muted2);flex-shrink:0}
.search-box input{
  flex:1;border:none;background:transparent;padding:9px 0;font-size:14px;color:var(--ink);min-width:0;
}
.search-box input:focus{outline:none}
.search-box input::placeholder{color:var(--muted2)}

/* ---------- Main ---------- */
main{max-width:1280px;margin:0 auto;padding:30px 28px 90px}
.view{display:none}
.view.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Shelf ---------- */
.shelf{margin-bottom:30px}
.shelf-head{
  display:flex;align-items:center;gap:14px;padding:16px 20px;
  background:var(--bg2);border:1px solid var(--rule);border-left:4px solid var(--c,var(--accent));
  border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:16px;
  transition:box-shadow .2s;
}
.shelf-head:hover{box-shadow:var(--shadow)}
.shelf-toggle{display:flex;align-items:center;gap:14px;flex:1;min-width:0;cursor:pointer}
.chevron{width:16px;height:16px;color:var(--muted);transition:transform .25s;flex-shrink:0}
.shelf.collapsed .chevron{transform:rotate(-90deg)}
.shelf-icon{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--c) 14%, transparent);color:var(--c);
}
.shelf-icon svg{width:18px;height:18px}
.shelf-title{font-family:'Lora',serif;font-size:18px;font-weight:700;letter-spacing:.01em}
.shelf-count{
  font-size:12px;font-weight:700;color:var(--c);
  background:color-mix(in srgb,var(--c) 13%, transparent);
  padding:3px 10px;border-radius:20px;min-width:24px;text-align:center;
}
.shelf-sub{font-size:12px;color:var(--muted);margin-left:2px}
.shelf-add{
  display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--c);
  background:color-mix(in srgb,var(--c) 11%, transparent);
  border:1px solid color-mix(in srgb,var(--c) 22%, transparent);
  transition:all .18s;white-space:nowrap;
}
.shelf-add:hover{background:var(--c);color:#fff}
.shelf-add svg{width:14px;height:14px}

.shelf-body{overflow:hidden;transition:max-height .3s ease,opacity .25s,margin .25s}
.shelf.collapsed .shelf-body{max-height:0!important;opacity:0;margin-top:-16px}
.books-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:16px;
}

/* ---------- Book Card ---------- */
.book-card{
  background:var(--bg3);border:1px solid var(--rule);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s;
}
.book-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.book-cover-wrap{
  position:relative;height:148px;overflow:hidden;
  background:linear-gradient(135deg,var(--accent2),#dcc4b5);
}
.book-cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.book-cover-placeholder{
  width:100%;height:100%;display:grid;place-items:center;padding:18px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--accent)) 30%,var(--accent2)),color-mix(in srgb,var(--c,var(--accent)) 16%,var(--accent2)));
}
.book-cover-placeholder .initial{
  font-family:'Lora',serif;font-size:46px;font-weight:700;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.18);line-height:1;
}
.book-cover-placeholder .ph-title{
  font-family:'Lora',serif;font-size:13px;color:rgba(255,255,255,.92);text-align:center;
  margin-top:8px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.book-cat-badge{
  position:absolute;top:10px;left:10px;font-size:11px;font-weight:600;
  padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.92);color:var(--c,var(--accent3));
  backdrop-filter:blur(4px);box-shadow:var(--shadow-sm);
}
.book-drop-tag{
  position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;
  padding:3px 10px;border-radius:20px;background:var(--dropped);color:#fff;
}
.book-media-badge{
  position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:20px;background:var(--c);color:#fff;
  display:flex;align-items:center;gap:4px;box-shadow:var(--shadow-sm);
}
.book-media-badge svg{width:12px;height:12px}
.book-card.is-dropped{opacity:.78}
.book-card.is-dropped .book-cover-wrap{filter:grayscale(.35)}
.book-body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:8px;flex:1}
.book-title{font-family:'Lora',serif;font-size:16px;font-weight:700;line-height:1.3;color:var(--ink)}
.book-author{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;transition:color .15s}
.book-author[data-act]{cursor:pointer}
.book-author[data-act]:hover{color:var(--accent3)}
.book-author.active{color:var(--accent3);font-weight:700}
.book-author svg{width:12px;height:12px}

/* category pills on cards */
.book-cats{display:flex;flex-wrap:wrap;gap:5px;margin-top:1px}
.cat-pill{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent);
  color:var(--c,var(--accent3));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 22%,transparent);
  transition:all .15s;cursor:pointer;line-height:1.4;
}
.cat-pill:hover{background:var(--c,var(--accent3));color:#fff;border-color:var(--c,var(--accent3))}
.cat-pill.active{background:var(--c,var(--accent3));color:#fff;border-color:var(--c,var(--accent3))}

/* progress */
.progress-block{margin-top:2px}
.progress-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}
.progress-mode{
  font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--reading);display:flex;align-items:center;gap:4px;
}
.progress-mode svg{width:11px;height:11px}
.progress-pct{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.progress-track{height:8px;background:var(--rule-soft);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent3),#9c5f6c);transition:width .5s cubic-bezier(.4,0,.2,1)}
.progress-fill.done{background:linear-gradient(90deg,var(--read),#a4b693)}
.progress-num{font-size:11.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}

.progress-quick{display:flex;gap:6px;align-items:center;margin-top:4px}
.progress-quick input{
  flex:1;min-width:0;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;
  background:var(--bg);font-size:13px;font-variant-numeric:tabular-nums;transition:border-color .15s;
}
.progress-quick input:focus{outline:none;border-color:var(--c,var(--accent3))}
.btn-mini{
  padding:7px 11px;border-radius:8px;font-size:12px;font-weight:600;
  background:var(--accent3);color:#fff;transition:all .15s;white-space:nowrap;
}
.btn-mini:hover{background:#8d5862}

.book-meta-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta-item{display:flex;align-items:center;gap:4px}
.meta-item svg{width:12px;height:12px;color:var(--muted2)}
.rating-stars{display:flex;gap:1px}
.rating-stars svg{width:13px;height:13px;color:var(--accent3)}
.rating-stars svg.empty{color:var(--rule)}

.editable-date{
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:2px 7px;
  border-radius:6px;border:1px dashed transparent;transition:all .15s;color:var(--muted);
}
.editable-date:hover{background:var(--rule-soft);border-color:var(--rule);color:var(--ink)}
.editable-date svg{width:11px;height:11px}

.book-actions{display:flex;gap:6px;margin-top:auto;padding-top:10px;border-top:1px solid var(--rule-soft)}
.act-btn{
  flex:1;padding:7px 8px;border-radius:8px;font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:4px;
  border:1px solid var(--rule);background:var(--bg);color:var(--ink-soft);transition:all .15s;
}
.act-btn svg{width:13px;height:13px}
.act-btn:hover{border-color:var(--c,var(--accent3));color:var(--c,var(--accent3))}
.act-btn.primary{background:var(--c,var(--accent3));color:#fff;border-color:var(--c,var(--accent3))}
.act-btn.primary:hover{filter:brightness(1.08)}
.act-btn.danger{color:var(--dropped)}
.act-btn.danger:hover{border-color:var(--dropped);color:#fff;background:var(--dropped)}

/* ---------- Empty state ---------- */
.empty{
  grid-column:1/-1;text-align:center;padding:34px 20px;color:var(--muted);
  border:1.5px dashed var(--rule);border-radius:var(--radius-md);background:var(--bg2);
}
.empty .empty-icon{width:42px;height:42px;margin:0 auto 10px;opacity:.5}
.empty p{font-size:13.5px}
.empty .empty-hint{font-size:12px;color:var(--muted2);margin-top:3px}

/* ---------- Shelves Layout (sidebar + content) ---------- */
.shelves-layout{display:flex;gap:24px;align-items:flex-start}
.media-sidebar{
  width:192px;flex-shrink:0;position:sticky;top:84px;
  display:flex;flex-direction:column;gap:10px;
}
.ms-header{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted2);padding:0 4px 8px;
}
.ms-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  border:1px solid transparent;background:transparent;color:var(--ink-soft);
  transition:all .15s;text-align:left;width:100%;
}
.ms-item:hover{background:var(--bg2);border-color:var(--rule)}

.ms-sub-item{
  display:flex;align-items:center;gap:8px;padding:6px 12px 6px 44px;
  border:none;background:transparent;color:var(--muted);
  transition:all .15s;text-align:left;width:100%;font-size:13px;
}
.ms-sub-item:hover{color:var(--ink);background:var(--bg2)}
.ms-sub-item.active{color:var(--c);font-weight:700;background:color-mix(in srgb,var(--c) 6%,transparent)}
.ms-sub-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--c);opacity:.65}
.ms-sub-item.active .ms-sub-dot{opacity:1}
.ms-sub-name{flex:1}
.ms-sub-count{font-size:10.5px;color:var(--muted2);background:var(--rule-soft);padding:1px 7px;border-radius:8px}
.ms-sub-item.active .ms-sub-count{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.ms-item.active{
  background:color-mix(in srgb,var(--c,var(--accent3)) 10%,var(--bg2));
  border-color:color-mix(in srgb,var(--c,var(--accent3)) 25%,transparent);
  color:var(--c,var(--accent3));font-weight:700;
}
.ms-icon{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--c,var(--muted2)) 14%,transparent);
  color:var(--c,var(--muted2));transition:all .15s;
}
.ms-item.active .ms-icon{
  background:color-mix(in srgb,var(--c,var(--accent3)) 20%,transparent);
  color:var(--c,var(--accent3));
}
.ms-icon svg{width:16px;height:16px}
.ms-name{flex:1;font-size:14px}
.ms-count{
  font-size:11px;font-weight:700;color:var(--muted2);
  background:var(--rule-soft);padding:2px 8px;border-radius:20px;min-width:20px;text-align:center;
}
.ms-item.active .ms-count{
  background:color-mix(in srgb,var(--c,var(--accent3)) 18%,transparent);
  color:var(--c,var(--accent3));
}
.shelves-main{flex:1;min-width:0}
.ms-hint{
  font-size:10.5px;color:var(--muted2);padding:10px 4px 0;
  line-height:1.5;text-align:center;
}

/* ---------- Drag & Drop ---------- */
.drag-ghost{
  opacity:.88!important;transform:scale(1.03) rotate(.5deg);
  filter:drop-shadow(0 16px 32px rgba(0,0,0,.25));
  border-radius:var(--radius);transition:none!important;
  max-height:280px;overflow:hidden;
}
body.is-dragging{cursor:grabbing!important;touch-action:none}
body.is-dragging *{cursor:grabbing!important}

.shelf.drag-over-before .shelf-head{box-shadow:0 -3px 0 0 var(--accent3),var(--shadow)}
.shelf.drag-over-after .shelf-head{box-shadow:0 3px 0 0 var(--accent3),var(--shadow)}
.book-card.drag-over-before{box-shadow:0 -3px 0 0 var(--accent3),var(--shadow)}
.book-card.drag-over-after{box-shadow:0 3px 0 0 var(--accent3),var(--shadow)}

/* ---------- Filter bar ---------- */
.filter-bar{
  display:flex;align-items:center;gap:10px;padding:12px 18px;margin-bottom:20px;
  background:var(--bg2);border:1px solid var(--rule);border-left:4px solid var(--accent3);
  border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
}
.filter-bar .fb-icon{width:16px;height:16px;color:var(--accent3);flex-shrink:0;display:flex}
.filter-bar .fb-icon svg{width:16px;height:16px}
.filter-bar .fb-label{font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.filter-bar .fb-chip{
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;
  font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:20px;
  background:var(--accent3);color:#fff;transition:all .15s;white-space:nowrap;
}
.filter-bar .fb-chip:hover{background:#8d5862}
.filter-bar .fb-chip svg{width:11px;height:11px;flex-shrink:0}
.filter-bar .fb-count{font-size:12px;color:var(--muted);margin-left:auto}
.filter-bar .fb-clear{
  display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;
  font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--rule);
  background:var(--bg3);transition:all .15s;white-space:nowrap;
}
.filter-bar .fb-clear:hover{color:var(--accent3);border-color:var(--accent3)}
.filter-bar .fb-clear svg{width:13px;height:13px}

/* ---------- Stats view ---------- */
.stats-hero{
  background:var(--bg2);border:1px solid var(--rule);border-radius:var(--radius);
  padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.stats-hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(700px 200px at 90% 0%,rgba(232,207,193,.4),transparent 60%);
  pointer-events:none;
}
.stats-hero h2{font-family:'Lora',serif;font-size:23px;font-weight:700;position:relative}
.stats-hero p{color:var(--muted);font-size:13.5px;margin-top:5px;position:relative}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:20px;position:relative}
.stat-card{
  background:var(--bg3);border:1px solid var(--rule);border-radius:var(--radius-md);
  padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.stat-card .stat-num{font-family:'Lora',serif;font-size:32px;font-weight:700;line-height:1;color:var(--c,var(--accent3));font-variant-numeric:tabular-nums}
.stat-card .stat-num small{font-size:15px;color:var(--muted);font-weight:400;margin-left:2px}
.stat-card .stat-label{font-size:12px;color:var(--muted);margin-top:7px;letter-spacing:.02em}
.stat-card .stat-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent3))}

.chart-row{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px}
.chart-card{background:var(--bg3);border:1px solid var(--rule);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow-sm)}
.chart-card h3{font-family:'Lora',serif;font-size:16px;font-weight:700;margin-bottom:3px}
.chart-card .chart-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.chart-box{width:100%;height:280px}
.chart-box.tall{height:320px}
.chart-empty{height:280px;display:grid;place-items:center;color:var(--muted2);font-size:13px;text-align:center;gap:8px}
.chart-empty svg{width:34px;height:34px;opacity:.5}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:100;background:rgba(58,50,43,.42);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:24px;animation:fade .2s ease;
}
.modal{
  background:var(--bg3);border-radius:20px;width:100%;max-width:520px;max-height:90vh;
  overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .25s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.modal-head{padding:20px 24px 6px;display:flex;align-items:start;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--bg3);border-radius:20px 20px 0 0;z-index:1}
.modal-head h3{font-family:'Lora',serif;font-size:19px;font-weight:700}
.modal-head p{font-size:12.5px;color:var(--muted);margin-top:2px}
.modal-close{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:all .15s;flex-shrink:0}
.modal-close:hover{background:var(--rule-soft);color:var(--ink)}
.modal-close svg{width:18px;height:18px}
.modal-body{padding:8px 24px 24px}

.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.field label .req{color:var(--accent3)}
.field label .opt{color:var(--muted2);font-weight:400}
.field input,.field select,.field textarea{
  width:100%;padding:10px 13px;border:1px solid var(--rule);border-radius:10px;
  background:var(--bg);transition:border-color .15s,box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--accent3);box-shadow:0 0 0 3px rgba(122,74,84,.1);
}
.field textarea{resize:vertical;min-height:64px;line-height:1.5}
.field-hint{font-size:11.5px;color:var(--muted2);margin-top:5px}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.segmented{display:flex;gap:4px;background:var(--rule-soft);padding:4px;border-radius:10px}
.segmented button{
  flex:1;padding:9px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.segmented button svg{width:14px;height:14px}
.segmented button.active{background:var(--bg3);color:var(--accent3);box-shadow:var(--shadow-sm)}

.shelf-picker,.media-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shelf-pick,.media-pick{
  padding:10px 6px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);
  text-align:center;font-size:12px;font-weight:600;color:var(--muted);transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.shelf-pick svg,.media-pick svg{width:17px;height:17px}
.shelf-pick:hover,.media-pick:hover{border-color:var(--c)}
.shelf-pick.active,.media-pick.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--bg));color:var(--c)}

/* category chips in form */
.cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cat-chip{
  font-size:12px;font-weight:600;padding:6px 13px;border-radius:20px;
  background:var(--bg);border:1.5px solid var(--rule);color:var(--muted);
  transition:all .15s;cursor:pointer;
}
.cat-chip:hover{border-color:var(--accent3);color:var(--accent3)}
.cat-chip.selected{background:var(--accent3);border-color:var(--accent3);color:#fff}
.cat-add{display:flex;gap:6px}
.cat-add input{
  flex:1;padding:7px 11px;border:1px solid var(--rule);border-radius:8px;
  background:var(--bg);font-size:13px;transition:border-color .15s;
}
.cat-add input:focus{outline:none;border-color:var(--accent3)}
.cat-add button{
  width:34px;height:34px;border-radius:8px;background:var(--accent3);color:#fff;
  font-size:18px;font-weight:600;display:grid;place-items:center;transition:all .15s;flex-shrink:0;
}
.cat-add button:hover{background:#8d5862}

.rating-input{display:flex;gap:5px}
.rating-input button{width:28px;height:28px;display:grid;place-items:center;transition:transform .12s}
.rating-input button:hover{transform:scale(1.15)}
.rating-input button svg{width:24px;height:24px;transition:color .15s}
.rating-input button.on svg{color:var(--accent3)}
.rating-input button.off svg{color:var(--rule)}

.modal-foot{padding:16px 24px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--rule-soft);position:sticky;bottom:0;background:var(--bg3);border-radius:0 0 20px 20px}
.btn{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;transition:all .15s;display:flex;align-items:center;gap:7px}
.btn svg{width:16px;height:16px}
.btn-ghost{color:var(--muted);border:1px solid var(--rule)}
.btn-ghost:hover{background:var(--rule-soft);color:var(--ink)}
.btn-primary{background:var(--accent3);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:#8d5862}
.btn-danger{background:var(--dropped);color:#fff}
.btn-danger:hover{filter:brightness(1.05)}

/* ---------- Confirm dialog ---------- */
.confirm{max-width:400px}
.confirm .modal-body{padding-top:18px}
.drop-options{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.drop-option{
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  border:1.5px solid var(--rule);border-radius:14px;
  background:var(--bg);transition:all .15s;text-align:left;width:100%;
}
.drop-option:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 5%,var(--bg));transform:translateY(-1px)}
.drop-option .opt-icon{
  width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);
}
.drop-option .opt-icon svg{width:20px;height:20px}
.drop-option .opt-title{font-size:15px;font-weight:700;color:var(--ink)}
.drop-option .opt-desc{font-size:12.5px;color:var(--muted);margin-top:2px}
.drop-reason{margin-top:14px}
.drop-reason label{font-size:13px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px}
.drop-reason textarea{
  width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;
  background:var(--bg);font-size:14px;font-family:inherit;line-height:1.5;resize:vertical;
  min-height:36px;transition:border-color .15s;
}
.drop-reason textarea:focus{outline:none;border-color:var(--dropped)}
.confirm-icon{width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--dropped) 16%,transparent);display:grid;place-items:center;margin-bottom:12px}
.confirm-icon svg{width:24px;height:24px;color:var(--dropped)}
.confirm p{font-size:14.5px;line-height:1.55}
.confirm .sub{font-size:13px;color:var(--muted);margin-top:6px}

/* ---------- Toast ---------- */
#toast-root{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{
  background:var(--ink);color:#fff;padding:13px 18px;border-radius:12px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:11px;min-width:240px;max-width:360px;
  animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);pointer-events:auto;
}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}
.toast .t-icon{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--read)}
.toast .t-icon svg{width:15px;height:15px;color:#fff}
.toast.warn .t-icon{background:var(--accent3)}
.toast.info .t-icon{background:var(--accent)}

/* ---------- Toolbar (stats) ---------- */
.stats-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.year-select{padding:8px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--bg3);font-weight:600;font-size:14px;cursor:pointer}
.stats-toolbar .legend{font-size:12.5px;color:var(--muted);margin-left:auto}

/* ---------- Responsive ---------- */
@media(max-width:860px){
  .chart-row{grid-template-columns:1fr}
  .header-inner{padding:10px 14px;gap:10px}
  .brand-text span{display:none}
  .brand-text h1{font-size:18px}
  .search-box{max-width:110px;padding:0 8px}
  .search-box input{font-size:12px;padding:7px 0}
  main{padding:12px 10px 70px}
  .nav-tab span{display:none}
  .nav-tab{padding:7px 10px}
  .shelf-head{padding:10px 12px;gap:8px}
  .shelf-add span{display:none}
  .shelf-sub{display:none}
  .books-grid{grid-template-columns:1fr;gap:10px}
  .field-row{grid-template-columns:1fr}
  .modal{max-width:100%}
  .filter-bar{flex-wrap:wrap;gap:8px}
  .filter-bar .fb-count{margin-left:0;width:100%}
  .shelf-picker,.media-picker{grid-template-columns:repeat(2,1fr)}
  .shelves-layout{gap:8px}
  .media-sidebar{
    width:30%;flex-shrink:0;position:sticky;top:56px;
    max-height:calc(100vh - 66px);overflow-y:auto;
    -webkit-overflow-scrolling:touch;gap:8px;
  }
  .ms-header{font-size:11px;padding:0 4px 6px}
  .ms-hint{display:none}
  .ms-item{padding:6px 4px;gap:4px}
  .ms-icon{width:22px;height:22px;border-radius:5px}
  .ms-icon svg{width:12px;height:12px}
  .ms-name{font-size:13px}
  .ms-count{font-size:9.5px;padding:1px 5px;min-width:16px}
  .ms-sub-item{padding:3px 4px 3px 26px;font-size:12px;gap:4px}
  .ms-sub-dot{width:4px;height:4px}
  .ms-sub-name{font-size:12px}
  .ms-sub-count{font-size:9px;padding:0 4px}
  .shelf-title{font-size:16px}
  .shelf-icon{width:28px;height:28px;border-radius:7px}
  .shelf-icon svg{width:15px;height:15px}
  .shelf-count{font-size:11px;padding:2px 8px}
  .chevron{width:15px;height:15px}
  .book-card{height:auto;overflow:visible}
  .book-cover-wrap{display:none}
  .book-body{padding:8px 12px 10px;gap:4px}
  .book-actions{margin-top:4px}
  .book-title{font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .book-author{font-size:13px}
  .book-cats{gap:4px;max-height:22px;overflow:hidden}
  .cat-pill{font-size:11px;padding:2px 7px}
  .progress-block{margin-top:1px}
  .progress-meta{font-size:12px;margin-bottom:4px}
  .progress-mode{font-size:10px}
  .progress-mode svg{width:10px;height:10px}
  .progress-track{height:6px}
  .progress-num{font-size:12px;margin-top:3px}
  .book-actions{gap:4px;padding-top:6px}
  .act-btn{padding:5px 6px;font-size:12px;gap:3px}
  .act-btn svg{width:12px;height:12px}
}
@media(max-width:480px){
  .books-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <div class="brand-text">
        <h1>阅记</h1>
        <span>我的阅读追踪</span>
      </div>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-view="shelves">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>书架</span>
      </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        <span>统计</span>
      </button>
    </nav>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="搜索书名、作者、类型…" />
    </div>
    <button class="icon-btn" id="settings-btn" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- Shelves View -->
  <section id="view-shelves" class="view active"><div id="app-loading" style="display:grid;place-items:center;padding:60px 20px;color:var(--muted);gap:12px"><div style="width:32px;height:32px;border:3px solid var(--rule);border-top-color:var(--accent3);border-radius:50%;animation:spin .8s linear infinite"></div><span style="font-size:14px">正在加载阅记…</span></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style></section>

  <!-- Stats View -->
  <section id="view-stats" class="view">
    <div class="stats-hero">
      <h2>进度概览</h2>
      <p>书页、光影、番剧与漫画，皆在此处留痕。</p>
      <div class="stat-grid" id="stat-grid"></div>
    </div>
    <div class="stats-toolbar">
      <select class="year-select" id="year-select"></select>
      <span class="legend">完成节奏按完成时间统计</span>
    </div>
    <div class="chart-row">
      <div class="chart-card">
        <h3>月度完成节奏</h3>
        <p class="chart-sub">每月完成的作品数量</p>
        <div class="chart-box" id="chart-monthly"></div>
      </div>
      <div class="chart-card">
        <h3>作品类型分布</h3>
        <p class="chart-sub">书籍 / 影视 / 动漫 / 漫画占比</p>

        <h3>评分分布</h3>

        <div class="chart-box" id="chart-rating"></div>
      </div>
    </div>
    <div class="chart-row" style="grid-template-columns:1fr">
      <div class="chart-card">
        <h3>在看进度</h3>
        <p class="chart-sub">当前正在追的每一部，进度一目了然</p>

<div id="modal-root"></div>

<script>
/* 阅记 · 统计图表 */
(function(){
'use strict';

var instances = {};
var EMPTY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 4 3 5-7"/></svg>';

function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function ensure(id){
  var el = document.getElementById(id);
  if(!el) return null;
  el.innerHTML = '';
  if(instances[id]){ try{ instances[id].dispose(); }catch(e){} }
  instances[id] = echarts.init(el, null, { renderer:'svg' });
  return instances[id];
}

function showEmpty(id, msg){
  var el = document.getElementById(id);
  if(!el) return;
  if(instances[id]){ try{ instances[id].dispose(); }catch(e){} delete instances[id]; }
  el.innerHTML = '<div class="chart-empty">'+EMPTY_SVG+'<span>'+(msg||'暂无数据')+'</span></div>';
}

window.addEventListener('resize', function(){
  Object.keys(instances).forEach(function(id){ if(instances[id]) instances[id].resize(); });
});

function render(stats){
  var accent = css('--accent') || '#98A9BC';
  var accent2 = css('--accent2') || '#E8CFC1';
  var accent3 = css('--accent3') || '#7A4A54';
  var ink = css('--ink') || '#3A322B';
  var muted = css('--muted') || '#8C7F73';
  var rule = css('--rule') || '#E9DFD3';
  var want = css('--want') || '#98A9BC';
  var reading = css('--reading') || '#7A4A54';
  var read = css('--read') || '#8B9A77';
  var dropped = css('--dropped') || '#A39B91';
  var bookC = '#98A9BC', filmC = '#7A4A54', animeC = '#8B9A77', mangaC = '#b08a76';

  /* ---------- 1. 月度完成节奏 ---------- */
  var months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  var monthlyData = stats.monthly;
  var monthlySum = monthlyData.reduce(function(a,b){return a+b;},0);
  if(monthlySum===0){
    showEmpty('chart-monthly', stats.year+' 年还没有完成的作品');
  } else {
    var c1 = ensure('chart-monthly');
    c1.setOption({
      grid:{ left:36, right:16, top:24, bottom:30 },
      tooltip:{ trigger:'axis', appendToBody:true, axisPointer:{ type:'shadow', shadowStyle:{ color:'rgba(122,74,84,.08)' } },
        formatter:function(p){ return p[0].name+'<br/>完成 <b>'+p[0].value+'</b> 部'; } },
      xAxis:{ type:'category', data:months, axisTick:{ show:false }, axisLine:{ lineStyle:{ color:rule } },
        axisLabel:{ color:muted, fontSize:11, interval:0 } },
      yAxis:{ type:'value', minInterval:1, splitLine:{ lineStyle:{ color:rule, type:'dashed' } },
        axisLabel:{ color:muted, fontSize:11 } },
      series:[{
        type:'bar', data:monthlyData, barWidth:'52%',
        itemStyle:{ borderRadius:[6,6,0,0], color:{ type:'linear', x:0,y:0,x2:0,y2:1,
          colorStops:[{ offset:0, color:'#9c5f6c' },{ offset:1, color:accent3 }] } },
        emphasis:{ itemStyle:{ color:'#8d5862' } },
        label:{ show:true, position:'top', color:accent3, fontSize:11, fontWeight:600, formatter:function(p){ return p.value?p.value:''; } }
      }]
    });
  }

  /* ---------- 2. 作品类型分布 ---------- */
  var md = stats.mediaCounts || {};
  var mediaNames = { book:'书籍', film:'影视', anime:'动漫', manga:'漫画' };
  var mediaColors = { book:bookC, film:filmC, anime:animeC, manga:mangaC };
  var mediaTotal = (md.book||0)+(md.film||0)+(md.anime||0)+(md.manga||0);
  if(mediaTotal===0){
    showEmpty('chart-media', '添加作品后展示');
  } else {
    var mediaData = ['book','film','anime','manga'].map(function(k){
      return { name:mediaNames[k], value:md[k]||0, itemStyle:{ color:mediaColors[k] } };
    });
    var c2 = ensure('chart-media');
    c2.setOption({

/* ---------- 进度计算 ---------- */
function progress(book){
  var total = +book.totalPages || 0;
  if(total<=0) return {pct:0, done:false, read:0, left:0, total:0};
  var cur = +book.currentPage || 0;
  var read = book.progressMode==='backward' ? (total - cur) : cur;
  read = Math.max(0, Math.min(read, total));
  var pct = Math.round(read/total*100);
  return { pct:pct, done:read>=total, read:read, left:total-read, total:total };
}

  var filtered = state.books;
  if(state.filterMedia){
    filtered = filtered.filter(function(b){ return b.mediaType===state.filterMedia; });
  }
  if(state.filterAuthor){
    filtered = filtered.filter(function(b){ return b.author === state.filterAuthor; });
  }
  if(state.filterCat){
    filtered = filtered.filter(function(b){ return catsOf(b).indexOf(state.filterCat)>=0; });
  }
  if(state.searchQ){
    var q = state.searchQ.toLowerCase();
    filtered = filtered.filter(function(b){
      var m = mediaOf(b);
      return (b.title||'').toLowerCase().indexOf(q)>=0
        || (b.author||'').toLowerCase().indexOf(q)>=0
        || catsOf(b).some(function(c){ return c.toLowerCase().indexOf(q)>=0; })
        || (b.notes||'').toLowerCase().indexOf(q)>=0
        || m.name.toLowerCase().indexOf(q)>=0;
    });
  }

  /* 综合筛选栏 */
  var hasFilter = state.filterCat || state.filterAuthor || state.searchQ;
  if(hasFilter){
    html += '<div class="filter-bar">';
    html += '<span class="fb-icon">'+I.filter+'</span>';
    if(state.filterAuthor){
      html += '<span class="fb-chip" data-act="clear-author">作者：'+esc(state.filterAuthor)+' '+I.close+'</span>';
    }
    if(state.filterCat){
      html += '<span class="fb-chip" data-act="clear-cat">类型：'+esc(state.filterCat)+' '+I.close+'</span>';
    }
    if(state.searchQ){
      html += '<span class="fb-chip" data-act="clear-search">搜索：'+esc(state.searchQ)+' '+I.close+'</span>';
    }
    html += '<span class="fb-count">共 '+filtered.length+' 部</span>';
    html += '<button class="fb-clear" data-act="clear-all">'+I.close+'清除全部</button>';
    html += '</div>';
  }

  /* 决定显示哪些书架 */
  var shelvesToShow = state.filterShelf ? [state.filterShelf] : state.shelfOrder;

  /* 书架 */
  shelvesToShow.forEach(function(sk){
    var s = SHELVES[sk];
    var books = filtered.filter(function(b){ return b.shelf===sk; });
    var collapsed = state.collapsed[sk];
    html += '<section class="shelf'+(collapsed?' collapsed':'')+'" data-shelf="'+sk+'" style="--c:'+s.color+'">';
    html += '<div class="shelf-head">';
    html += '<div class="shelf-toggle" data-act="toggle" data-shelf="'+sk+'">'+I.chevron;
    html += '<div class="shelf-icon" style="--c:'+s.color+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+s.icon+'</svg></div>';
    html += '<div><div class="shelf-title">'+s.name+'</div><div class="shelf-sub">'+s.sub+'</div></div>';
    html += '<span class="shelf-count" style="--c:'+s.color+'">'+books.length+'</span></div>';
    html += '<button class="shelf-add" data-act="add" data-shelf="'+sk+'" style="--c:'+s.color+'">'+I.plus+'<span>添加</span></button>';
    html += '</div>';
    html += '<div class="shelf-body"><div class="books-grid">';
    if(books.length===0){ html += emptyHTML(sk); }
    else { books.forEach(function(b){ html += bookCard(b); }); }
    html += '</div></div></section>';
  });

  html += '</div>'; /* shelves-main */
  html += '</div>'; /* shelves-layout */

  root.innerHTML = html;
}

function emptyHTML(shelf){
  var hints = {
    want:'书名/片名即可，作者选填',
    reading:'从「想看」点击「开始」移入',
    read:'完成后自动归入，也可直接添加',
    dropped:'在看时点「弃看」即移入此处'
  };
  var msg = (state.filterCat || state.filterMedia || state.filterShelf || state.filterAuthor || state.searchQ) ? '当前筛选下没有作品' : '这里还空空如也';
  var hint = (state.filterCat || state.filterMedia || state.filterShelf || state.filterAuthor || state.searchQ) ? '试试清除筛选或选择其它类型' : (hints[shelf]||'');
  return '<div class="empty"><div class="empty-icon">'+I.empty+'</div><p>'+msg+'</p><div class="empty-hint">'+hint+'</div></div>';
}

function coverHTML(book){
  var c = SHELVES[book.shelf].color;
  if(book.cover){
    return '<img src="'+esc(book.cover)+'" alt="'+esc(book.title)+'封面" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">'
      + '<div class="book-cover-placeholder" style="display:none;--c:'+c+'"><div class="initial">'+esc((book.title||'书').slice(0,1))+'</div></div>';
  }
  return '<div class="book-cover-placeholder" style="--c:'+c+'"><div class="initial">'+esc((book.title||'书').slice(0,1))+'</div><div class="ph-title">'+esc(book.title)+'</div></div>';
}

function starsHTML(n){
  var h='';
  for(var i=1;i<=5;i++){ h += '<svg class="'+(i<=n?'':'empty')+'" viewBox="0 0 24 24" '+(i<=n?'fill="currentColor"':'fill="none"')+' stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'; }
  return '<span class="rating-stars">'+h+'</span>';
}

function bookCard(b){
  var s = SHELVES[b.shelf];
  var c = s.color;
  var m = mediaOf(b);
  var h = '<article class="book-card'+(b.shelf==='dropped'?' is-dropped':'')+'" data-id="'+b.id+'" style="--c:'+c+'">';
  h += '<div class="book-cover-wrap">'+coverHTML(b);
  h += '<span class="book-media-badge" style="--c:'+m.color+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+m.icon+'</svg>'+m.short+'</span>';
  h += '</div>';
  h += '<div class="book-body">';
  h += '<div class="book-title">'+esc(b.title)+'</div>';
  if(b.author){
    var authorActive = state.filterAuthor===b.author;
    h += '<div class="book-author'+(authorActive?' active':'')+'" data-act="filter-author" data-author="'+esc(b.author)+'">'+I.user+esc(b.author)+'</div>';
  } else {
    h += '<div class="book-author">'+I.user+'佚名</div>';
  }

  /* 类型标签（可点击筛选） */
  var cats = catsOf(b);
  if(cats.length){
    h += '<div class="book-cats">';
    cats.forEach(function(cat){
      var active = state.filterCat===cat;
      h += '<button class="cat-pill'+(active?' active':'')+'" data-act="filter-cat" data-cat="'+esc(cat)+'">'+esc(cat)+'</button>';
    });
    h += '</div>';
  }

  if(b.shelf==='reading'){
    var p = progress(b);
    var u = unitOf(b); var v = verbOf(b);
    var modeLabel = b.progressMode==='backward' ? '倒数（剩余）' : '正数（已'+v+'）';
    var modeIcon = b.progressMode==='backward' ? I.arrowDown : I.arrowUp;
    h += '<div class="progress-block">';
    h += '<div class="progress-meta"><span class="progress-mode">'+modeIcon+modeLabel+'</span><span class="progress-pct">'+p.pct+'%</span></div>';
    h += '<div class="progress-track"><div class="progress-fill'+(p.done?' done':'')+'" style="width:'+p.pct+'%"></div></div>';
    var numText = b.progressMode==='backward'
      ? '剩余 '+p.left+' '+u+' / 共 '+p.total+' '+u
      : '已'+v+' '+p.read+' '+u+' / 共 '+p.total+' '+u;
    h += '<div class="progress-num">'+numText+'</div>';
    h += '<div class="progress-quick" style="--c:'+c+'">';
    h += '<input type="number" min="0" placeholder="'+(b.progressMode==='backward'?'剩余'+u:'已'+v+u)+'" data-act="quick-input" value="'+(b.currentPage||'')+'">';
    h += '<button class="btn-mini" data-act="quick-update" style="--c:'+c+'">更新</button>';
    h += '</div>';
    h += '</div>';
  }

  if(b.shelf==='read'){
    h += '<div class="book-meta-row">';
    h += '<span class="meta-item editable-date" data-act="edit-date" data-field="finishDate" title="点击修改完成日期">'+I.calendar+fmtDateShort(b.finishDate)+'</span>';
    if(b.rating>0) h += starsHTML(b.rating);
    if(b.totalPages>0) h += '<span class="meta-item">'+I.pages+b.totalPages+unitOf(b)+'</span>';
    h += '</div>';
  }

  if(b.shelf==='dropped' && b.dropReason){
    h += '<div class="book-meta-row"><span class="meta-item" style="color:var(--muted2)">弃看理由：'+esc(b.dropReason)+'</span></div>';
  }

  /* 操作按钮 */
  h += '<div class="book-actions">';
  if(b.shelf==='want'){
    var startLabel = (m.verb==='看')?'开始观看':'开始阅读';
    h += actBtn('primary','start',startLabel,I.play);
    h += actBtn('','edit','编辑',I.pencil);
    h += actBtn('danger','delete','',I.trash);
  } else if(b.shelf==='reading'){
    var doneLabel = (m.verb==='看')?'看完':'读完';
    h += actBtn('','done',doneLabel,I.check);
    h += actBtn('','edit','编辑',I.pencil);
    h += actBtn('danger','drop','弃看',I.trash);
  } else if(b.shelf==='read'){
    h += actBtn('','edit','编辑',I.pencil);
    h += actBtn('danger','delete','',I.trash);
  } else if(b.shelf==='dropped'){
    h += actBtn('','rewant','想再看',I.refresh);
    h += actBtn('danger','delete','',I.trash);
  }
  h += '</div>';
  h += '</div></article>';
  return h;
}

function actBtn(cls,act,label,icon){
  return '<button class="act-btn '+cls+'" data-act="'+act+'">'+icon+(label?'<span>'+label+'</span>':'')+'</button>';
}

/* ---------- 事件 ---------- */
function bindEvents(){
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if(!t) return;
    var act = t.getAttribute('data-act');
    var card = t.closest('.book-card');
    var id = card ? card.getAttribute('data-id') : null;

    if(act==='toggle'){ state.collapsed[t.getAttribute('data-shelf')] = !state.collapsed[t.getAttribute('data-shelf')]; renderShelves(); return; }
    if(act==='add'){ openAddModal(t.getAttribute('data-shelf')); return; }
    if(act==='filter-cat'){
      var cat = t.getAttribute('data-cat');
      state.filterCat = (state.filterCat===cat) ? null : cat;
      renderShelves();
      return;
    }
    if(act==='clear-filter'){ state.filterCat=null; renderShelves(); return; }
    if(act==='clear-cat'){ state.filterCat=null; renderShelves(); return; }
    if(act==='clear-author'){ state.filterAuthor=null; renderShelves(); return; }
    if(act==='clear-search'){ state.searchQ=''; var si=document.getElementById('search-input'); if(si) si.value=''; renderShelves(); return; }
    if(act==='clear-all'){
      state.filterCat=null; state.filterAuthor=null; state.searchQ='';
      var si2=document.getElementById('search-input'); if(si2) si2.value='';
      renderShelves(); return;
    }
    if(act==='select-media-shelf'){
      var mk = t.getAttribute('data-media');
      var sk2 = t.getAttribute('data-shelf');
      state.filterMedia = mk;
      state.filterShelf = sk2;
      state.filterCat = null;
      state.filterAuthor = null;
      renderShelves();
      return;
    }
    if(act==='select-media'){
      var media = t.getAttribute('data-media');
      state.filterMedia = media || null;
      state.filterShelf = null;
      renderShelves();
      return;
    }
    if(act==='filter-author'){
      var author = t.getAttribute('data-author');
      state.filterAuthor = (state.filterAuthor===author) ? null : author;
      renderShelves(); return;
    }

    if(!id) return;
    var book = find(id); if(!book) return;

    if(act==='start'){ openStartModal(book); }
    else if(act==='edit'){ openEditModal(book); }
    else if(act==='delete'){ confirmDelete(book); }
    else if(act==='done'){ completeBook(book, true); }
    else if(act==='drop'){ dropBook(book); }
    else if(act==='rewant'){ moveShelf(book,'want'); toast('已移回「想看」','info'); }
    else if(act==='quick-update'){ quickUpdate(book, card); }
    else if(act==='edit-date'){ openEditModal(book, t.getAttribute('data-field')); }
  });

  document.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.matches('[data-act="quick-input"]')){
      var card = e.target.closest('.book-card');
      var book = find(card.getAttribute('data-id'));
      if(book) quickUpdate(book, card);
    }
    if(e.key==='Escape'){ closeModal(); }
  });

  document.querySelectorAll('.nav-tab').forEach(function(b){
    b.addEventListener('click', function(){ setView(b.getAttribute('data-view')); });
  });
  document.getElementById('settings-btn').addEventListener('click', openSettings);

  var searchInput = document.getElementById('search-input');
  if(searchInput){
    var searchTimer = null;
    searchInput.addEventListener('input', function(){
      clearTimeout(searchTimer);
      var val = searchInput.value.trim();
      searchTimer = setTimeout(function(){
        state.searchQ = val;
        if(state.view!=='shelves') setView('shelves');
        renderShelves();
      }, 200);
    });
    searchInput.addEventListener('keydown', function(e){
      if(e.key==='Escape'){ searchInput.value=''; state.searchQ=''; renderShelves(); searchInput.blur(); }
    });
  }
}

function find(id){ return state.books.filter(function(b){return b.id===id;})[0]; }

/* ---------- 视图切换 ---------- */
function setView(v){
  state.view = v;
  document.querySelectorAll('.nav-tab').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-view')===v); });
  document.querySelectorAll('.view').forEach(function(el){ el.classList.toggle('active', el.id==='view-'+v); });
  if(v==='stats'){ renderStats(); }
}

/* 暴露给图表点击筛选 */
window.Yueji = {
  filterByCat: function(cat){ state.filterCat = cat; state.filterMedia = null; state.filterShelf = null; state.filterAuthor = null; setView('shelves'); renderShelves(); },
  clearFilter: function(){ state.filterCat=null; renderShelves(); }
};

/* ---------- 快速更新进度 ---------- */
function quickUpdate(book, card){
  var input = card.querySelector('[data-act="quick-input"]');
  var raw = (input.value||'').trim();
  if(raw===''){ toast('请输入数值','warn'); return; }
  var val = parseInt(raw,10);
  if(isNaN(val) || val<0){ toast('请输入有效数值','warn'); return; }
  var total = +book.totalPages||0;
  if(book.progressMode==='backward'){
    if(val > total){ toast('剩余量不能超过总量','warn'); return; }
    book.currentPage = val;
  } else {
    if(val > total) val = total;
    book.currentPage = val;
  }
  var p = progress(book);
  save(); renderShelves();
  if(p.done){ completeBook(book, false); }
  else { toast('进度已更新 · '+p.pct+'%','success'); }
}

/* ---------- 完成 ---------- */
function completeBook(book, manual){
  if(book.shelf!=='reading') return;
  book.shelf='read';
  if(book.totalPages>0) book.currentPage = book.totalPages;
  book.progressMode='forward';
  if(!book.finishDate) book.finishDate = todayStr();
  save(); renderShelves();
  if(state.view==='stats') renderStats();
  var v = verbOf(book);
  toast('恭喜'+(v==='看'?'看完':'读完')+'《'+book.title+'》','success');
}

/* ---------- 弃看 ---------- */
function dropBook(book){
  var html = '';
  html += '<div class="modal-head"><div><h3>放弃这部作品？</h3></div>';
  html += '<button class="modal-close" data-close="1">'+I.close+'</button></div>';
  html += '<div class="modal-body">';
  html += '<p style="font-size:14.5px;line-height:1.55">《'+esc(book.title)+'》如何处理？</p>';
  html += '<div class="drop-options">';
  html += '<button class="drop-option" id="opt-drop" style="--c:var(--dropped)">';
  html += '<div class="opt-icon">'+I.trash+'</div>';
  html += '<div><div class="opt-title">移入弃看</div><div class="opt-desc">保留记录，可随时重新想看</div></div>';
  html += '</button>';
  html += '<button class="drop-option" id="opt-delete" style="--c:var(--accent3)">';
  html += '<div class="opt-icon">'+I.trash+'</div>';
  html += '<div><div class="opt-title">永久删除</div><div class="opt-desc">从所有书架中删除，不可恢复</div></div>';
  html += '</button>';
  html += '</div>';
  html += '<div class="drop-reason"><label>弃看理由（可选）</label><textarea id="drop-reason-input" placeholder="为什么放弃这部作品？" rows="2"></textarea></div>';
  html += '</div>';
  html += '<div class="modal-foot"><button class="btn btn-ghost" data-close="1">取消</button></div>';
  openModal(html, 'confirm');
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeModal); });
  document.getElementById('opt-drop').addEventListener('click', function(){
    var reason = document.getElementById('drop-reason-input').value.trim();
    closeModal();
    book.shelf='dropped'; book.dropReason=reason||''; save(); renderShelves();
    if(state.view==='stats') renderStats();
    toast('已移入「弃看」','warn');
  });
  document.getElementById('opt-delete').addEventListener('click', function(){
    closeModal();
    confirmDelete(book);
  });
}
function moveShelf(book, shelf){ book.shelf=shelf; save(); renderShelves(); if(state.view==='stats') renderStats(); }

/* ---------- 删除 ---------- */
function confirmDelete(book){
  openConfirm({
    title:'删除这部作品？',
    body:'《'+esc(book.title)+'》将从所有书架中永久删除，此操作不可撤销。',
    confirmText:'删除', danger:true,
    onConfirm:function(){
      state.books = state.books.filter(function(b){ return b.id!==book.id; });
      save(); renderShelves();
      if(state.view==='stats') renderStats();
      toast('已删除','info');
    }
  });
}

/* ---------- 模态框 ---------- */
function openModal(html, cls){
  var root = document.getElementById('modal-root');
  root.innerHTML = '<div class="modal-overlay" id="overlay"><div class="modal'+(cls?' '+cls:'')+'">'+html+'</div></div>';
  document.getElementById('overlay').addEventListener('click', function(e){
    if(e.target===this) closeModal();
  });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function openConfirm(opt){
  var html = '';
  html += '<div class="modal-head"><div><h3>'+esc(opt.title)+'</h3></div>';
  html += '<button class="modal-close" data-close="1">'+I.close+'</button></div>';
  html += '<div class="modal-body"><div class="confirm-icon" style="--c:'+(opt.danger?'#A39B91':'#98A9BC')+'">'+I.alert+'</div>';
  html += '<p>'+(opt.body||'')+'</p>'+(opt.sub?'<p class="sub">'+esc(opt.sub)+'</p>':'')+'</div>';
  html += '<div class="modal-foot"><button class="btn btn-ghost" data-close="1">取消</button>';
  html += '<button class="btn '+(opt.danger?'btn-danger':'btn-primary')+'" id="confirm-ok">'+esc(opt.confirmText||'确认')+'</button></div>';
  openModal(html, 'confirm');
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeModal); });
  document.getElementById('confirm-ok').addEventListener('click', function(){
    closeModal(); if(opt.onConfirm) opt.onConfirm();
  });
}

/* 添加 */
function openAddModal(shelfKey){
  var defaultMedia = state.filterMedia || 'book';
  var book = { id:'', title:'', author:'', cover:'', shelf:shelfKey||'want', mediaType:defaultMedia, unit:MEDIA[defaultMedia].unit, totalPages:0, currentPage:0, progressMode:'forward', categories:[], rating:0, notes:'', addedDate:todayStr(), startDate:shelfKey==='reading'?todayStr():'', finishDate:shelfKey==='read'?todayStr():'' };
  bookForm(book, 'add');
}
/* 开始：想看→在看 */
function openStartModal(book){
  var draft = Object.assign({}, book, { shelf:'reading', startDate: todayStr(), totalPages: book.totalPages||0, progressMode:'forward' });
  bookForm(draft, 'start', book);
}
/* 编辑 */
function openEditModal(book, focusField){ bookForm(book, 'edit', null, focusField); }

function bookForm(book, mode, orig, focusField){
  var isAdd = mode==='add';
  formCats = mediaCategories(book.mediaType).slice();
  var html = '<div class="modal-head"><div><h3>';
  html += isAdd ? '添加作品' : '编辑作品';
  html += '</h3><p>'+ (mode==='start'?'从「想看」开启进度':'填写作品信息') +'</p></div>';
  html += '<button class="modal-close" data-close="1">'+I.close+'</button></div>';
  html += '<div class="modal-body">';

  /* 作品类型 */
  html += '<div class="field"><label>作品类型</label><div class="media-picker">';
  MEDIA_ORDER.forEach(function(mk){
    var md = MEDIA[mk];
    html += '<button type="button" class="media-pick'+(mk===book.mediaType?' active':'')+'" data-media="'+mk+'" style="--c:'+md.color+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+md.icon+'</svg>'+md.name+'</button>';
  });
  html += '</div></div>';

  /* 书架选择（仅添加） */
  if(isAdd){
    html += '<div class="field"><label>归类到</label><div class="shelf-picker">';
    state.shelfOrder.forEach(function(sk){
      var sh=SHELVES[sk];
      html += '<button type="button" class="shelf-pick'+(sk===book.shelf?' active':'')+'" data-pick="'+sk+'" style="--c:'+sh.color+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+sh.icon+'</svg>'+sh.name+'</button>';
    });
    html += '</div></div>';
  }

  html += '<div id="form-dynamic">'+dynamicFields(book)+'</div>';
  html += '</div>';
  html += '<div class="modal-foot"><button class="btn btn-ghost" data-close="1">取消</button>';
  html += '<button class="btn btn-primary" id="form-save">'+I.check+'保存</button></div></div>';

  openModal(html);
  currentDraft = book;
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeModal); });

  /* 作品类型切换 */
  document.querySelectorAll('[data-media]').forEach(function(b){
    b.addEventListener('click', function(){
      captureForm(book);
      book.mediaType = b.getAttribute('data-media');
      book.unit = MEDIA[book.mediaType].unit;
      formCats = mediaCategories(book.mediaType).slice();
      document.querySelectorAll('[data-media]').forEach(function(x){ x.classList.toggle('active', x===b); });
      refreshDynamic(book);
    });
  });

  /* 书架切换 */
  if(isAdd){
    document.querySelectorAll('[data-pick]').forEach(function(b){
      b.addEventListener('click', function(){
        captureForm(book);
        book.shelf = b.getAttribute('data-pick');
        if(book.shelf==='reading' && !book.startDate) book.startDate = todayStr();
        if(book.shelf==='read' && !book.finishDate) book.finishDate = todayStr();
        document.querySelectorAll('[data-pick]').forEach(function(x){ x.classList.toggle('active', x===b); });
        refreshDynamic(book);
      });
    });
  }

  bindDynamic();
  bindCats(book);

  document.getElementById('form-save').addEventListener('click', function(){
    collectAndSave(book, mode, orig);
  });

  if(focusField){
    setTimeout(function(){ var el=document.getElementById('f-'+focusField); if(el){ el.focus(); try{ el.showPicker && el.showPicker(); }catch(e){} } },60);
  } else {
    setTimeout(function(){ var t=document.getElementById('f-title'); if(t) t.focus(); },60);
  }
}

function refreshDynamic(book){
  var el = document.getElementById('form-dynamic');
  if(!el) return;
  el.innerHTML = dynamicFields(book);
  bindDynamic();
  bindCats(book);
}

function dynamicFields(book){
  var m = mediaOf(book);
  var u = unitOf(book);
  var v = m.verb;
  var h = '';
  h += '<div class="field"><label>名称 <span class="req">*</span></label><input id="f-title" type="text" placeholder="书名 / 片名 / 作品名" value="'+esc(book.title)+'"></div>';
  h += '<div class="field"><label>'+m.creator+' <span class="opt">（选填）</span></label><input id="f-author" type="text" placeholder="'+m.creator+' / 制作方" value="'+esc(book.author||'')+'"></div>';

  var totalLbl = (u==='分钟') ? '总时长（分钟）' : '总'+u+'数';

  if(book.shelf==='reading' || book.shelf==='read'){
    h += '<div class="field-row">';
    h += '<div class="field"><label>'+(book.shelf==='reading'?'<span class="req">*</span> ':'')+totalLbl+'</label><input id="f-totalPages" type="number" min="0" placeholder="如 360" value="'+(book.totalPages||'')+'"></div>';
    h += '<div class="field"><label>进度单位</label><select id="f-unit">'+UNITS.map(function(uo){ return '<option value="'+uo+'"'+(uo===u?' selected':'')+'>'+uo+'</option>'; }).join('')+'</select></div>';
    h += '</div>';
    if(book.shelf==='reading'){
      var curLbl = (u==='分钟') ? ('已'+v+'时长') : ('已'+v+u+'数');
      h += '<div class="field"><label>当前进度</label><input id="f-currentPage" type="number" min="0" placeholder="'+curLbl+'" value="'+(book.currentPage||'')+'"></div>';
    }
  }
  if(book.shelf==='reading'){
    h += '<div class="field"><label>计数方式</label><div class="segmented" id="mode-seg">';
    h += '<button type="button" data-mode="forward" class="'+(book.progressMode==='forward'?'active':'')+'">'+I.arrowUp+'正着数（已'+v+'）</button>';
    h += '<button type="button" data-mode="backward" class="'+(book.progressMode==='backward'?'active':'')+'">'+I.arrowDown+'倒着数（剩余）</button>';
    h += '</div><div class="field-hint">正着数从 0 累加；倒着数从总量递减，归零即自动完成。</div></div>';
    h += '<div class="field"><label>开始日期</label><input id="f-startDate" type="date" value="'+esc(book.startDate||'')+'"></div>';
  }
  if(book.shelf==='read'){
    h += '<div class="field-row">';
    h += '<div class="field"><label>完成日期</label><input id="f-finishDate" type="date" value="'+esc(book.finishDate||todayStr())+'"></div>';
    h += '<div class="field"><label>评分</label><div class="rating-input" id="rating-input">'+ratingButtons(book.rating||0)+'</div></div>';
    h += '</div>';
  }
  /* 类型（多选 chip）—— 想看/在看/已看 都有 */
  if(book.shelf!=='dropped'){
    h += categoryFieldHTML(book);
  }
  if(book.shelf==='dropped'){
    h += '<div class="field"><label>弃看原因 <span class="opt">（选填）</span></label><textarea id="f-notes" placeholder="为何放下这部作品...">'+esc(book.notes||'')+'</textarea></div>';
  }
  if(book.shelf==='reading' || book.shelf==='read'){
    h += '<div class="field"><label>笔记 / 短评 <span class="opt">（选填）</span></label><textarea id="f-notes" placeholder="摘录、感悟或一句话点评...">'+esc(book.notes||'')+'</textarea></div>';
  }
  return h;
}

/* 类型多选字段 */
function categoryFieldHTML(book){
  var pool = unionArr(formCats, catsOf(book));
  var sel = {}; catsOf(book).forEach(function(c){ sel[c]=1; });
  var h = '<div class="field"><label>类型 <span class="opt">（可多选，点击卡片标签可筛选）</span></label>';
  h += '<div class="cat-chips" id="cat-chips">';
  h += pool.map(function(c){ return '<button type="button" class="cat-chip'+(sel[c]?' selected':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>'; }).join('');
  h += '</div>';
  h += '<div class="cat-add"><input id="f-cat-new" type="text" placeholder="输入新类型，回车或点 + 添加"><button type="button" id="cat-add-btn">+</button></div>';
  h += '<p class="cat-hint" style="font-size:11px;color:var(--muted2);margin-top:4px">长按自定义类型可删除</p>';
  h += '</div>';
  return h;
}
function unionArr(a,b){ var s={}; (a||[]).forEach(function(c){s[c]=1;}); (b||[]).forEach(function(c){s[c]=1;}); return Object.keys(s); }

function ratingButtons(n){
  var h='';
  for(var i=1;i<=5;i++){ h += '<button type="button" data-rate="'+i+'" class="'+(i<=n?'on':'off')+'">'+I.star+'</button>'; }
  return h;
}

function bindDynamic(){
  var seg = document.getElementById('mode-seg');
  if(seg){
    seg.querySelectorAll('[data-mode]').forEach(function(b){
      b.addEventListener('click', function(){
        seg.querySelectorAll('[data-mode]').forEach(function(x){ x.classList.toggle('active', x===b); });
      });
    });
  }
  var ri = document.getElementById('rating-input');
  if(ri){
    ri.querySelectorAll('[data-rate]').forEach(function(b){
      b.addEventListener('click', function(){
        var val = parseInt(b.getAttribute('data-rate'),10);
        ri.querySelectorAll('[data-rate]').forEach(function(x){
          var r = parseInt(x.getAttribute('data-rate'),10);
          x.className = r<=val?'on':'off';
        });
        ri.dataset.value = val;
      });
    });
  }
  var us = document.getElementById('f-unit');
  if(us){
    us.addEventListener('change', function(){
      if(!currentDraft) return;
      captureForm(currentDraft);
      currentDraft.unit = us.value;
      refreshDynamic(currentDraft);
    });
  }
}

/* 类型 chip 交互（点击选中，长按删除自定义类型） */
function bindChipClicks(book){
  var chips = document.getElementById('cat-chips');
  if(!chips) return;
  chips.querySelectorAll('[data-cat]').forEach(function(btn){
    var pressTimer = null;
    var longFired = false;
    btn.addEventListener('click', function(e){
      if(longFired){ longFired = false; e.preventDefault(); return; }
      var cat = btn.getAttribute('data-cat');
      var idx = book.categories.indexOf(cat);
      if(idx>=0){ book.categories.splice(idx,1); btn.classList.remove('selected'); }
      else { book.categories.push(cat); btn.classList.add('selected'); }
    });
    function startPress(){
      longFired = false;
      pressTimer = setTimeout(function(){
        longFired = true;
        if(navigator.vibrate) navigator.vibrate(30);
        var cat = btn.getAttribute('data-cat');
        var isDefault = (DEFAULT_CATS[book.mediaType]||[]).indexOf(cat) >= 0;
        if(isDefault){ toast('默认类型不可删除','warn'); return; }
        openConfirm({
          title:'删除类型', body:'确认删除「'+esc(cat)+'」？该类型将从所有同类作品中移除。',
          confirmText:'删除', danger:true,
          onConfirm:function(){
            state.books.forEach(function(b){
              if(b.mediaType === book.mediaType){
                var i2 = b.categories.indexOf(cat);
                if(i2 >= 0) b.categories.splice(i2, 1);
              }
            });
            var fi = formCats.indexOf(cat);
            if(fi >= 0) formCats.splice(fi, 1);
            save();
            var box = document.getElementById('cat-chips');
            if(box){
              var pool = unionArr(formCats, catsOf(book));
              var sel = {}; catsOf(book).forEach(function(c){ sel[c]=1; });
              box.innerHTML = pool.map(function(c){ return '<button type="button" class="cat-chip'+(sel[c]?' selected':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>'; }).join('');
              bindChipClicks(book);
            }
            toast('已删除类型「'+cat+'」','warn');
          }
        });
      }, 500);
    }
    function cancelPress(){ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } }
    btn.addEventListener('mousedown', startPress);
    btn.addEventListener('mouseup', cancelPress);
    btn.addEventListener('mouseleave', cancelPress);
    btn.addEventListener('touchstart', startPress, {passive:true});
    btn.addEventListener('touchend', cancelPress);
    btn.addEventListener('touchcancel', cancelPress);
  });
}

function bindCats(book){
  bindChipClicks(book);
  var addBtn = document.getElementById('cat-add-btn');
  var addInput = document.getElementById('f-cat-new');
  function addNew(){
    if(!addInput) return;
    var val = (addInput.value||'').trim();
    if(!val) return;
    if(formCats.indexOf(val)<0) formCats.push(val);
    if(book.categories.indexOf(val)<0) book.categories.push(val);
    addInput.value='';
    var box = document.getElementById('cat-chips');
    if(box){
      var pool = unionArr(formCats, catsOf(book));
      var sel = {}; catsOf(book).forEach(function(c){ sel[c]=1; });
      box.innerHTML = pool.map(function(c){ return '<button type="button" class="cat-chip'+(sel[c]?' selected':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>'; }).join('');
      bindChipClicks(book);
    }
  }
  if(addBtn) addBtn.addEventListener('click', addNew);
  if(addInput) addInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); addNew(); } });
}

/* 把当前表单值写回 draft（categories 由 chip 实时维护，无需读取） */
function captureForm(book){
  currentDraft = book;
  book.title = val('f-title') || book.title;
  book.author = val('f-author');
  book.totalPages = num('f-totalPages');
  book.currentPage = num('f-currentPage');
  book.notes = val('f-notes');
  book.startDate = val('f-startDate');
  book.finishDate = val('f-finishDate');
  var us = document.getElementById('f-unit');
  if(us) book.unit = us.value;
  var ms = document.querySelector('#mode-seg [data-mode].active');
  if(ms) book.progressMode = ms.getAttribute('data-mode');
  var ri = document.getElementById('rating-input');
  if(ri && ri.dataset.value) book.rating = parseInt(ri.dataset.value,10);
  return book;
}

function collectAndSave(book, mode, orig){
  currentDraft = book;
  captureForm(book);
  if(!book.title){ toast('请填写名称','warn'); return; }
  if(book.shelf==='reading' && book.totalPages<=0){ toast('请填写总量','warn'); return; }

  var data = {
    title:book.title, author:book.author, cover:book.cover,
    mediaType:book.mediaType, unit:unitOf(book),
    totalPages:book.totalPages, currentPage:book.currentPage,
    progressMode:book.progressMode, categories:catsOf(book).slice(),
    notes:book.notes, startDate:book.startDate, finishDate:book.finishDate,
    rating:book.rating, shelf:book.shelf
  };

  if(mode==='add'){
    data.id = uid();
    data.addedDate = todayStr();
    state.books.push(data);
    save(); closeModal(); renderShelves();
    toast('已添加到「'+SHELVES[data.shelf].name+'」','success');
  } else {
    var target = orig || book;
    Object.keys(data).forEach(function(k){ if(k!=='shelf' || mode==='edit') target[k]=data[k]; });
    if(mode==='start'){ target.shelf='reading'; if(!target.startDate) target.startDate=todayStr(); }
    save(); closeModal(); renderShelves();
    if(state.view==='stats') renderStats();
    if(target.shelf==='reading'){
      var p = progress(target);
      if(p.done) completeBook(target, false);
    }
    toast('已保存','success');
  }
}
function val(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
function num(id){ var el=document.getElementById(id); if(!el||el.value==='') return 0; var n=parseInt(el.value,10); return isNaN(n)?0:n; }

/* ---------- Toast ---------- */
function toast(msg, type){
  type = type||'info';
  var root = document.getElementById('toast-root');

  var el = document.createElement('div');
